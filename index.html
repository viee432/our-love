<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For My Favorite Person 🎀</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Georgia",serif;
}

body{
height:100vh;
overflow:hidden;
background:linear-gradient(135deg,#fff0f6,#ffd6e8);
display:flex;
justify-content:center;
align-items:center;
}


.container{
text-align:center;
animation:muncul 1.5s ease;
}


h1{
font-size:40px;
color:#ff5c9a;
text-shadow:0 0 15px #ffb6d5;
}


p{
margin-top:20px;
font-size:20px;
color:#777;
}


button{
margin-top:35px;
padding:15px 45px;
border:none;
border-radius:50px;
background:#ff8fbd;
color:white;
font-size:18px;
cursor:pointer;
}


#halaman2{
display:none;
text-align:center;
animation:muncul 1.5s ease;
}


.card{
background:white;
padding:20px;
margin:15px;
border-radius:25px;
display:inline-block;
box-shadow:0 5px 20px #ffc1dc;
}


@keyframes muncul{
from{
opacity:0;
transform:translateY(30px);
}
to{
opacity:1;
transform:translateY(0);
}
}


/* bunga */

.bunga{
position:absolute;
top:-20px;
animation:jatuh 8s linear infinite;
font-size:25px;
}

@keyframes jatuh{
from{
transform:translateY(-10vh);
}
to{
transform:translateY(110vh);
}
}


</style>

</head>


<body>


<div class="bunga" style="left:20%;">🌸</div>
<div class="bunga" style="left:50%;">🌸</div>
<div class="bunga" style="left:80%;">🌸</div>



<div class="container" id="halaman1">

<h1>
🎀 For My Favorite Person 🎀
</h1>


<p>
hallo sayangg.
</p>


<p>
🌸 Selamat datang di little universe kita 🌸
</p>


<button onclick="alert('Berhasil diklik!')">
🤍 Masuk
</button>

</div>



<div id="halaman2">

<h1>
🤍 Welcome To My Little Universe 🤍
</h1>


<p>
Tempat kecil yang aku buat khusus untuk kamu.
</p>


<div class="card">
💌 Letters
</div>


<div class="card">
📸 Memories
</div>


<div class="card">
🤲 Prayers
</div>


</div>



<script>

function masuk(){

document.getElementById("halaman1").style.display="none";

document.getElementById("halaman2").style.display="block";

}

</script>


</body>
</html>
